# ── Rate-limit zones ─────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m   rate=60r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# ── Xavfsizlik sarlavhalari makrosi ──────────────────────────────────────────
# Nginx-da add_header faqat bitta darajada ishlaydi; har bir location
# bloki ota-blok sarlavhalarini bekor qiladi. Shu sababli sarlavhalar
# har bir location ichida takrorlanadi.
map $host $sec_xframe          { default "SAMEORIGIN"; }
map $host $sec_xcto            { default "nosniff"; }
map $host $sec_xxss            { default "1; mode=block"; }
map $host $sec_ref             { default "strict-origin-when-cross-origin"; }
map $host $sec_perm            { default "geolocation=(), microphone=(), camera=()"; }
map $host $sec_csp             { default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';"; }

server {
    listen 80;
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml;

    # ── Yashirin fayllarni bloklash ───────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log  off;
        log_not_found off;
    }

    # ── Login: qattiq rate-limit ──────────────────────────────────────────────
    location = /api/auth/login {
        limit_req        zone=login burst=5 nodelay;
        limit_req_status 429;

        # Spring Security o'z sarlavhalarini yuboradi — takrorlanmaslik uchun yashirish
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;

        add_header X-Frame-Options        $sec_xframe   always;
        add_header X-Content-Type-Options $sec_xcto     always;
        add_header X-XSS-Protection       $sec_xxss     always;
        add_header Referrer-Policy        $sec_ref      always;
        add_header Permissions-Policy     $sec_perm     always;
        add_header Content-Security-Policy $sec_csp     always;
        add_header Cache-Control          "no-store"    always;

        proxy_pass         http://backend:8081/api/auth/login;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Barcha API so'rovlari ─────────────────────────────────────────────────
    location /api/ {
        limit_req        zone=api burst=20 nodelay;
        limit_req_status 429;

        # Spring Security sarlavhalarini yashirish (nginx o'zinikini qo'shadi)
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;

        add_header X-Frame-Options        $sec_xframe   always;
        add_header X-Content-Type-Options $sec_xcto     always;
        add_header X-XSS-Protection       $sec_xxss     always;
        add_header Referrer-Policy        $sec_ref      always;
        add_header Permissions-Policy     $sec_perm     always;
        add_header Content-Security-Policy $sec_csp     always;
        add_header Cache-Control          "no-store, no-cache, must-revalidate" always;

        proxy_pass         http://backend:8081/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Statik fayllar: 1 yillik kesh ────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires    1y;
        access_log off;

        add_header X-Frame-Options        $sec_xframe       always;
        add_header X-Content-Type-Options $sec_xcto         always;
        add_header Cache-Control          "public, immutable" always;
    }

    # ── React SPA ─────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Frame-Options        $sec_xframe   always;
        add_header X-Content-Type-Options $sec_xcto     always;
        add_header X-XSS-Protection       $sec_xxss     always;
        add_header Referrer-Policy        $sec_ref      always;
        add_header Permissions-Policy     $sec_perm     always;
        add_header Content-Security-Policy $sec_csp     always;
        add_header Cache-Control          "no-cache"    always;
    }

    # ── 429 Too Many Requests ─────────────────────────────────────────────────
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        return 429 "{\"error\":\"Juda kop sorov yuborildi. Biroz kuting.\"}";
    }
}
