# ── Rate-limit zones ─────────────────────────────────────────────────────────
# API: 60 so'rov/daqiqa per IP
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
# Login: 10 urinish/daqiqa per IP (brute-force himoya)
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;

    # Nginx versiyasini yashirish
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Xavfsizlik sarlavhalari ───────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options    "nosniff"                      always;
    add_header X-XSS-Protection          "1; mode=block"                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';" always;

    # ── Gzip siqish ──────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml;

    # ── Statik fayllar: kesh ─────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
        # Xavfsizlik sarlavhalarini takrorlash (location ichida override bo'ladi)
        add_header  X-Frame-Options        "SAMEORIGIN"    always;
        add_header  X-Content-Type-Options "nosniff"       always;
    }

    # ── Login: qattiqroq rate-limit ──────────────────────────────────────────
    location = /api/auth/login {
        limit_req        zone=login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend:8081/api/auth/login;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Barcha API so'rovlari ─────────────────────────────────────────────────
    location /api/ {
        limit_req        zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend:8081/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Cache yo'q — API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── React SPA ─────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ── Yashirin fayllarni bloklash (.env, .git, ...) ─────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── 429 xato sahifasi ────────────────────────────────────────────────────
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"Juda ko'\''p so'\''rov. Iltimos, biroz kuting."}';
    }
}
